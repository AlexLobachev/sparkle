<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, nofollow">
    <title>Sparkle — Знакомьтесь с новыми людьми!</title>

    <link rel="stylesheet" th:href="@{/css/main-page.css}" media="screen">
    <meta name="csrf-token" th:content="${_csrf.token}"/>
</head>
<body>

<div class="page-wrapper">

    <header class="app-header">
        <h1 class="app-title">
            <span class="logo">Sparkle</span>
            <span class="subtitle">— Знакомьтесь с новыми людьми!</span>
        </h1>
    </header>

    <main>
        <!-- Уведомление email -->
        <th:block th:if="${user != null and user.emailPending}">
            <div class="container">
                <div class="alert">
                    <p>✉️ Укажите email:</p>
                    <form method="post" th:action="@{/update-email}" novalidate>
                        <input type="email" name="email" class="email-input" placeholder="example@domain.com" required>
                        <button type="submit" class="action-btn">Сохранить</button>
                        <small>Не передаём третьим лицам</small>
                    </form>
                </div>
            </div>
        </th:block>

        <!-- Карточка -->
        <div class="container">
            <section class="profile-card-container" id="profileViewer">
                <!-- Overlay для визуала -->
                <div class="overlay like-overlay"></div>
                <div class="overlay dislike-overlay"></div>

                <!-- Нет кандидатов -->
                <div class="no-candidates" id="noCandidates" style="display: none;">
                    <img src="/images/icons/refresh.svg" alt="Обновить" class="refresh-icon">
                    <p>Кандидатов больше нет</p>
                    <button class="action-btn reload-btn">Обновить</button>
                </div>

                <!-- Профиль -->
                <div class="profile-card" id="profileCard">
                    <!-- Фото — только оно реагирует на свайп и клик -->
                    <div class="photo" id="currentPhoto"></div>

                    <!-- Кнопки — всегда видны, НЕ в зоне свайпа -->
                    <div class="action-buttons">
                        <button class="action-circle dislike-btn" id="dislikeBtn">
                            <img src="/images/icons/dislike.svg" alt="Дизлайк">
                        </button>
                        <button class="action-circle like-btn" id="likeBtn">
                            <img src="/images/icons/like.svg" alt="Лайк">
                        </button>
                    </div>

                    <!-- Информация -->
                    <div class="profile-info" id="profileInfo"></div>
                </div>

                <!-- Нижняя навигация -->
                <div class="action-frame">
                    <div class="bottom-nav">
                        <button class="nav-btn" id="profileBtn"><img src="/images/icons/profile.svg" alt="Профиль"></button>
                        <button class="nav-btn" id="editProfileBtn"><img src="/images/icons/settings-profile.svg" alt="Настройки"></button>
                        <button class="nav-btn" id="chatsMatchesBtn"><img src="/images/icons/heart-chats.svg" alt="Чаты"></button>
                        <button class="nav-btn" id="logoutBtn"><img src="/images/icons/exit.svg" alt="Выход"></button>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <footer>
        <p>© <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy')}">2025</span> Sparkle</p>
    </footer>
</div>

<script th:src="@{/js/main-page.js}" defer></script>
<script th:inline="javascript">
    /*<![CDATA[*/
    window.currentUserId = /*[[${userId}]]*/ null;
    /*]]>*/
</script>
</body>
</html>
