<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Настройка профиля — Sparkle</title>
    <link rel="stylesheet" th:href="@{/css/profile-user.css}" media="screen"/>
    <meta name="csrf-token" th:content="${_csrf.token}"/>
</head>
<body>

<div class="page-wrapper">

    <header class="header">
        <h1>Настройка профиля</h1>
        <button id="backBtn" class="action-btn back">← Назад</button>
    </header>

    <main class="main-content">

        <!-- Скрытый input для передачи ID пользователя -->
        <input type="hidden" id="user-id" th:value="${userId}" />

        <form id="profileForm" class="settings-form">
            <div class="form-group">
                <label for="gender">Пол:</label>
                <select id="gender" name="gender">
                    <option value="">Не указан</option>
                    <option value="MAN">Мужской</option>
                    <option value="WOMEN">Женский</option>
                </select>
            </div>

            <div class="form-group">
                <label for="preferredGender">Предпочитаемый пол:</label>
                <select id="preferredGender" name="preferredGender">
                    <option value="">Не указан</option>
                    <option value="MAN">Мужской</option>
                    <option value="WOMEN">Женский</option>
                </select>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="example@domain.com"/>
            </div>

            <div class="form-group">
                <label for="birthDate">Дата рождения:</label>
                <input type="date" id="birthDate" name="birthDate"/>
            </div>

            <div class="form-actions">
                <button type="submit" class="action-btn primary">Сохранить изменения</button>
                <button type="button" id="deleteProfileBtn" class="action-btn danger">Удалить профиль</button>
            </div>
        </form>

        <div id="messages"></div>

    </main>

    <footer class="footer">
        <p>© <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy')}">2025</span> Sparkle. Все права защищены.</p>
    </footer>

</div>

<script th:src="@{/js/init-user.js}" th:nonce="${cspNonce}"></script>
<script th:src="@{/js/edit-profile.js}" th:nonce="${cspNonce}"></script>
</body>
</html>
