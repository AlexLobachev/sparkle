<!-- НАСТРОЙКА ПРОФИЛЯ email, пол, дата рождения при регистрации-->
<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Настройка профиля — Sparkle</title>
    <link rel="stylesheet" th:href="@{/css/registration.css}" media="screen"/>
    <link rel="stylesheet" th:href="@{/css/location.css}" media="screen"/>
    <meta name="csrf-token" th:content="${_csrf.token}"/>
    <meta name="csrf-header" th:content="${_csrf.headerName}"/>
    <script th:inline="javascript">
        /*<![CDATA[*/
        const currentUserId = /*[[${userId}]]*/ null;
        /*]]>*/
    </script>
</head>
<body>

<div class="page-wrapper">

    <header class="header">
        <h1>Настройка профиля</h1>
    </header>

    <main class="main-content">

        <!-- Модальное окно для определения местоположения -->
        <div class="location-modal" id="locationModal">
            <div class="location-content">
                <h3>Определить ваш город?</h3>
                <p>Мы можем определить ваше местоположение, чтобы автоматически заполнить поле «Город».</p>

                <div class="location-actions">
                    <button type="button" id="getLocationBtn" class="btn-icon-circle">
                        <img src="/images/icons/location.svg" th:src="@{/images/icons/location.svg}" alt="Определить место">
                    </button>
                    <button type="button" id="skipLocationBtn" class="btn-text">Я не хочу оставлять цифровой след</button>
                </div>

                <!-- Ручной ввод (если геолокация не удалась) -->
                <div id="manualInput" class="manual-input" style="display: none;">
                    <label for="cityInput">Введите город:</label>
                    <input type="text" id="cityInput" placeholder="Например, Москва">
                    <button type="button" id="confirmCityBtn" class="btn-small">Подтвердить</button>
                </div>
            </div>
        </div>


        <!-- Основная карточка -->
        <div class="tabs-card">
            <form id="profileForm">

                <!-- Пол -->
                <div class="form-group">
                    <label>Ваш пол</label>
                    <div class="gender-options">
                        <label class="gender-option">
                            <input type="radio" name="gender" value="MEN" required>
                            <div class="icon-circle">
                                <img src="/images/icons/gender-male.svg" th:src="@{/images/icons/gender-male.svg}" alt="Мужской">
                            </div>
                        </label>
                        <label class="gender-option">
                            <input type="radio" name="gender" value="WOMEN" required>
                            <div class="icon-circle">
                                <img src="/images/icons/gender-female.svg" th:src="@{/images/icons/gender-female.svg}" alt="Женский">
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Предпочтительный пол (без "Любой") -->
                <div class="form-group">
                    <label>Предпочтительный пол</label>
                    <div class="gender-options">
                        <label class="gender-option">
                            <input type="radio" name="preferredGender" value="MEN" required>
                            <div class="icon-circle">
                                <img src="/images/icons/gender-male.svg" th:src="@{/images/icons/gender-male.svg}" alt="Мужской">
                            </div>
                        </label>
                        <label class="gender-option">
                            <input type="radio" name="preferredGender" value="WOMEN" required>
                            <div class="icon-circle">
                                <img src="/images/icons/gender-female.svg" th:src="@{/images/icons/gender-female.svg}" alt="Женский">
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Город -->
                <div class="form-group">
                    <label for="city">Город</label>
                    <input type="text" id="city" name="city" placeholder="Введите город" required>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="example@domain.com">
                </div>

                <!-- Дата рождения (обязательна) -->
                <div class="form-group">
                    <label for="birthDate">Дата рождения</label>
                    <input type="date" id="birthDate" name="birthDate" required>
                </div>

                <!-- Обо мне -->
                <div class="form-group">
                    <label for="aboutMe">Обо мне</label>
                    <textarea id="aboutMe" name="aboutMe" rows="4" placeholder="Расскажите о себе..."></textarea>
                </div>

                <!-- Интересы -->
                <div class="form-group">
                    <label>Интересы</label>
                    <div id="interestList" class="interest-tags"></div>
                    <div class="interest-controls">
                        <select id="interestSelect">
                            <option value="">Выбрать</option>
                        </select>
                        <button type="button" id="addInterestBtn" class="icon-btn">
                            <img src="/images/icons/interest-add.svg" th:src="@{/images/icons/interest-add.svg}" alt="Добавить">
                        </button>
                    </div>
                </div>

                <!-- Фото -->
                <div class="form-group">
                    <label>Фото профиля</label>
                    <div class="photo-slider">
                        <div class="photo" id="currentPhoto"></div>
                    </div>
                    <div class="photo-controls">
                        <input type="file" id="profilePhoto" accept="image/*" style="display: none;">
                        <button type="button" id="uploadBtn" class="icon-btn">
                            <img src="/images/icons/picture-upload.svg" th:src="@{/images/icons/picture-upload.svg}" alt="Загрузить">
                        </button>
                        <button type="button" id="deleteBtn" class="icon-btn danger" disabled>
                            <img src="/images/icons/picture-remove.svg" th:src="@{/images/icons/picture-remove.svg}" alt="Удалить">
                        </button>
                    </div>
                </div>

                <!-- Сохранить -->
                <div class="form-actions">
                    <button type="submit" id="saveBtn" class="icon-btn">
                        <img src="/images/icons/save.svg" th:src="@{/images/icons/save.svg}" alt="Сохранить">
                    </button>
                </div>

            </form>
        </div>

        <!-- Сообщения -->
        <div id="messages"></div>

        <!-- Кнопка выхода -->
        <div class="bottom-action">
            <button id="logoutBtn" class="nav-btn-large">
                <img src="/images/icons/exit.svg" th:src="@{/images/icons/exit.svg}" alt="Выход">
            </button>
        </div>

    </main>

    <footer class="footer">
        <p>© <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy')}">2025</span> Sparkle. Все права защищены.</p>
    </footer>

</div>

<script th:src="@{/js/init-user.js}" th:nonce="${cspNonce}"></script>
<script th:src="@{/js/registration.js}" th:nonce="${cspNonce}"></script>
<script th:src="@{/js/location.js}" th:nonce="${cspNonce}"></script>
</body>
</html>
