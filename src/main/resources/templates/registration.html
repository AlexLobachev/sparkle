<!DOCTYPE html>
<html lang="ru" xmlns:th="https://thymeleaf.org" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
      xsi:schemaLocation="https://thymeleaf.org ">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заполнение профиля</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <!-- CSRF-токен -->
    <meta name="csrf-token" th:content="${_csrf.token}"/>
    <script th:src="@{/js/setup-profile.js}" th:nonce="${cspNonce}" defer></script>
</head>
<body>
<div class="setup-container">




    <header class="setup-header">
        <h1>Добро пожаловать!</h1>
        <p>Пожалуйста, заполните основные данные профиля</p>
    </header>

    <form id="setupForm" class="setup-form">
        <!-- Пол (обязательный) -->
        <div class="form-group">
            <label for="gender">Ваш пол <span class="required">*</span></label>
            <select id="gender" name="gender" required>
                <option value="">Выберите</option>
                <option value="MAN">Мужской</option>
                <option value="WOMEN">Женский</option>
            </select>
        </div>

        <!-- Предпочитаемый пол для знакомства (обязательный) -->
        <div class="form-group">
            <label for="preferredGender">Предпочтительный пол <span class="required">*</span></label>
            <select id="preferredGender" name="preferredGender" required>
                <option value="">Выберите</option>
                <option value="MAN">Мужской</option>
                <option value="WOMEN">Женский</option>
                <option value="BOTH">Любой</option>
            </select>
        </div>

        <!-- Дата рождения (обязательная) -->
        <div class="form-group">
            <label for="birthDate">Дата рождения <span class="required">*</span></label>
            <input type="date" id="birthDate" name="birthDate" required>
        </div>

        <!-- Город (обязательный) -->
        <div class="form-group">
            <label for="city">Город <span class="required">*</span></label>
            <input type="text" id="city" name="city" placeholder="Введите город" required>
        </div>

        <!-- Email (необязательный) -->
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="example@domain.com">
        </div>

        <!-- Фото профиля (необязательное) -->
        <div class="form-group">
            <label for="profilePhoto">Фото профиля</label>
            <input type="file" id="profilePhoto" name="profilePhoto" accept="image/*">
            <div class="photo-preview" id="photoPreview"></div>
        </div>

        <!-- Обо мне (необязательное) -->
        <div class="form-group">
            <label for="aboutMe">Обо мне</label>
            <textarea id="aboutMe" name="aboutMe" rows="4" placeholder="Расскажите о себе..."></textarea>
        </div>

        <!-- Интересы (необязательные) -->
        <div class="form-group">
            <label>Интересы</label>
            <div class="interests-grid" id="interestsContainer">
                <!-- Динамически генерируемые чекбоксы -->
            </div>
        </div>

          <div class="auth-controls">
                <button id="logoutBtn" class="action-btn logout">Выход</button>
            </div>

        <!-- Кнопка отправки -->
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Сохранить и продолжить</button>
        </div>
    </form>

    <!-- Сообщения об ошибках/успехе -->
    <div id="messages" class="messages"></div>
</div>
</body>
</html>
