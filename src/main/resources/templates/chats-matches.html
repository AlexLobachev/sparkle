<!-- Чаты и мэтчи -->
<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Чаты и мэтчи — Sparkle</title>
    <link rel="stylesheet" th:href="@{/css/chats-matches.css}" media="screen"/>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>

<body>
<div class="page-wrapper">
    <!-- Шапка -->
    <header class="header">
        <h1>Чаты и мэтчи</h1>
    </header>

    <main class="main-content">
        <!-- Белый блок с вкладками -->
        <div class="tabs-card">
            <div class="tabs">
                <button class="tab active" data-tab="matches">
                    <img src="/images/icons/sisters-love-relationships-people.svg"
                         th:src="@{/images/icons/sisters-love-relationships-people.svg}" alt="Мои мэтчи">
                </button>
                <button class="tab" data-tab="chats">
                    <img src="/images/icons/chats-2-line.svg" th:src="@{/images/icons/chats-2-line.svg}" alt="Мои чаты">
                </button>
                <button class="tab" data-tab="my-likes">
                    <img src="/images/icons/love-feel-emotion.svg" th:src="@{/images/icons/love-feel-emotion.svg}"
                         alt="Кто мне нравится">
                </button>
                <button class="tab" data-tab="who-liked-me">
                    <img src="/images/icons/love-2.svg" th:src="@{/images/icons/love-2.svg}" alt="Кому я понравился">
                </button>
            </div>

            <div class="tab-content">
                <!-- Список мэтчей -->
                <div id="matches" class="tab-pane active">
                    <div id="matchesLoader" class="loader">Загрузка мэтчей...</div>
                    <ul id="matchesList" class="user-list"></ul>
                    <div id="noMatches" class="no-data">Нет мэтчей</div>
                </div>

                <!-- Список чатов -->
                <div id="chats" class="tab-pane">
                    <div id="chatsLoader" class="loader">Загрузка чатов...</div>
                    <ul id="chatsList" class="user-list"></ul>
                    <div id="noChats" class="no-data">Нет чатов</div>
                </div>

                <!-- Кому я понравился -->
                <div id="my-likes" class="tab-pane">
                    <div id="likesLoader" class="loader">Загрузка...</div>
                    <ul id="likesList" class="user-list"></ul>
                    <div id="noLikes" class="no-data">Пока нет лайков</div>
                </div>

                <!-- Кто мне понравился -->
                <div id="who-liked-me" class="tab-pane">
                    <div id="whoLikedLoader" class="loader">Загрузка...</div>
                    <ul id="whoLikedList" class="user-list"></ul>
                    <div id="noWhoLiked" class="no-data">Никто пока не понравился</div>
                </div>
            </div>
        </div>

        <!-- Кнопка "Назад" внизу -->
        <div class="bottom-action">
            <button id="bottomBackBtn" class="nav-btn-large">
                <img src="/images/icons/back-two-arrows.svg" th:src="@{/images/icons/back-two-arrows.svg}" alt="Назад">
            </button>
        </div>
    </main>

    <footer class="footer">
        <p>© <span id="year">2025</span> Sparkle. Все права защищены.</p>
    </footer>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    window.currentUserId = [[${#authentication.principal.id}]];
    /*]]>*/
</script>
<script th:src="@{/js/chats-matches.js}" th:nonce="${cspNonce}"></script>
</body>
</html>
