<!-- Профиль пользователя -->
<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <title>Профиль пользователя — Sparkle</title>
    <link rel="stylesheet" th:href="@{/css/profile-user.css}" media="screen"/>
    <script th:inline="javascript">
        /*<![CDATA[*/
        window.currentUserId = [[${#authentication.principal.id}]];
        const userProfileId = /*[[${profileId}]]*/ null;
        /*]]>*/
    </script>
</head>
<body>
<div class="page-wrapper">

    <!-- Шапка -->
    <header class="header">
        <h1>Профиль пользователя</h1>
    </header>

    <main class="main-content">

        <!-- Фото -->
        <section class="photo-section">
            <div class="photo-slider" id="photoSlider">
                <div class="photo" id="currentPhoto"></div>
                <button class="slide-btn prev" id="prevPhoto">‹</button>
                <button class="slide-btn next" id="nextPhoto">›</button>
            </div>
            <div class="photo-indicator" id="photoIndicator"></div>
        </section>

        <!-- Информация -->
        <section class="info-section">
            <h2 id="username">Имя пользователя</h2>
            <p><strong>Возраст:</strong> <span id="age">—</span></p>
            <p><strong>Пол:</strong> <span id="gender">—</span></p>
            <p><strong>Город:</strong> <span id="city">—</span></p>

            <div id="aboutMe" class="about-me">
                <strong>О себе:</strong>
                <p>Пользователь пока ничего о себе не рассказал.</p>
            </div>

            <div id="interests" class="interests">
                <strong>Интересы:</strong>
                <ul></ul>
            </div>

            <!-- Кнопки действий -->
            <div class="actions-row">
                <button id="sendMessageBtn" class="action-option-btn">
                    <div class="icon-circle primary">
                        <img src="/images/icons/chats-2-line.svg" th:src="@{/images/icons/chats-2-line.svg}" alt="Написать">
                    </div>
                </button>
                <button id="bottomBackBtn" class="action-option-btn">
                    <div class="icon-circle primary">
                        <img src="/images/icons/back-two-arrows.svg" th:src="@{/images/icons/back-two-arrows.svg}" alt="Назад">
                    </div>
                </button>
            </div>
        </section>
    </main>

    <!-- Модальное окно чата -->
    <div class="chat-modal" id="chatModal">
        <div class="chat-container" id="chatContainer">
            <div class="chat-header">
                <h3 id="chatHeader">Чат</h3>
                <button class="chat-close" id="chatCloseBtn">&times;</button>
            </div>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input">
                <input type="text" id="chatInput" placeholder="Введите сообщение...">
                <button id="chatSendBtn">Отправить</button>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>© <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy')}">2025</span> Sparkle. Все права защищены.</p>
    </footer>
</div>

<script th:src="@{/js/profile-user.js}" defer th:nonce="${cspNonce}"></script>
</body>
</html>
