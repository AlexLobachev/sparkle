<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Мой профиль — Sparkle</title>
    <link rel="stylesheet" th:href="@{/css/profile-user.css}" media="screen"/>
    <meta name="csrf-token" th:content="${_csrf.token}"/>
    <script th:inline="javascript">
        /*<![CDATA[*/
        const currentUserId = /*[[${userId}]]*/ null;
        /*]]>*/
    </script>
</head>
<body>

<div class="page-wrapper">

    <header class="header">
        <h1>Мой профиль</h1>
        <button id="backBtn" class="action-btn back">← Назад</button>
    </header>

    <main class="main-content">

        <!-- Фото -->
        <section class="photo-section">
            <div class="photo-slider">
                <button class="slide-btn prev" id="prevPhoto">‹</button>
                <div class="photo" id="currentPhoto"></div>
                <button class="slide-btn next" id="nextPhoto">›</button>
            </div>
            <div class="photo-indicator" id="photoIndicator"></div>

            <div class="photo-controls">
                <input type="file" id="photoInput" accept="image/*" style="display: none;"/>
                <button id="uploadBtn" class="action-btn primary">Загрузить фото</button>
                <button id="deleteBtn" class="action-btn danger" disabled>Удалить фото</button>
            </div>

            <div class="thumbnails" id="thumbnails"></div>
        </section>

        <!-- Интересы -->
        <section class="info-section">
            <h2>Интересы</h2>
            <div class="interests">
                <div id="interestList" class="interest-tags"></div>
            </div>

            <div class="interest-controls">
                <select id="interestSelect" multiple>
                    <option value="">Выбрать интересы</option>
                </select>
                <button id="addInterestBtn" class="action-btn primary">Добавить</button>
                <button id="removeInterestBtn" class="action-btn danger">Удалить</button>
            </div>
        </section>

        <!-- О себе -->
        <section class="info-section">
            <h2>О себе</h2>
            <div class="about-me">
                <textarea id="aboutMe" rows="4" placeholder="Расскажите о себе..."></textarea>
                <button id="saveAboutBtn" class="action-btn primary full-width">Сохранить</button>
            </div>
        </section>

        <div id="messages"></div>

    </main>

    <footer class="footer">
        <p>© <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy')}">2025</span> Sparkle. Все права защищены.</p>
    </footer>

</div>

<script th:src="@{/js/init-user.js}" th:nonce="${cspNonce}" defer></script>
<script th:src="@{/js/profile.js}" th:nonce="${cspNonce}" defer></script>
</body>
</html>
